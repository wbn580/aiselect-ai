name = "aiselect-ai"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

[assets]
not_found_handling = "404-page"
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

# 运行时文章层（R254，d1_runtime_scaffold 生成）。只存还没进构建产物的
# 新文章，静态正本优先。刻意不设 run_worker_first：Worker 只接管构建产物里
# 根本不存在的路径（云构建等价闸按 dist manifest 逐文件核 sha256）。
[[d1_databases]]
binding = "DB"
database_name = "aiselect-ai-content"
database_id = "67812d65-9ac3-446b-ad2d-79c843676969"
